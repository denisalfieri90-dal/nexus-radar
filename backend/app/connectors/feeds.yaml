# Feed RSS/Atom ufficiali o pubblici. Lo stato di ogni feed è visibile nella pagina "Fonti":
# se un URL cambia, aggiornalo qui. Non includiamo fonti a pagamento (Bloomberg, Reuters):
# i loro termini d'uso non consentono lo scraping.
feeds:
  # --- Banche centrali e regolatori ---
  - {name: Federal Reserve, url: "https://www.federalreserve.gov/feeds/press_all.xml", channel: macro}
  - {name: BCE, url: "https://www.ecb.europa.eu/rss/press.html", channel: macro}
  - {name: SEC press, url: "https://www.sec.gov/news/pressreleases.rss", channel: regulatory}
  # --- Difesa e spazio ---
  - {name: Breaking Defense, url: "https://breakingdefense.com/feed/", channel: defense_cyber}
  - {name: Defense One, url: "https://www.defenseone.com/rss/all/", channel: defense_cyber}
  - {name: SpaceNews, url: "https://spacenews.com/feed/", channel: space}
  # --- Commodity ed energia ---
  - {name: Mining.com, url: "https://www.mining.com/feed/", channel: metals}
  - {name: OilPrice, url: "https://oilprice.com/rss/main", channel: energy}
  # --- Crypto ---
  - {name: CoinDesk, url: "https://www.coindesk.com/arc/outboundfeeds/rss/", channel: crypto}
  # --- Tecnologia e ricerca (segnali di adozione precoce) ---
  - {name: Hacker News, url: "https://hnrss.org/frontpage", channel: tech}
  - {name: arXiv quant-ph, url: "https://export.arxiv.org/rss/quant-ph", channel: quantum}
  # --- Contro-narrazione (letta come segnale di sentiment, non come fonte di fatti) ---
  - {name: ZeroHedge, url: "https://feeds.feedburner.com/zerohedge/feed", channel: contrarian}
